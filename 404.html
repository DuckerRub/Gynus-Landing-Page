<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Open Gynus — Join your group</title>
    <link rel="icon" type="image/png" href="/mascot.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@300;400&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=group-v1" />
    <style>[hidden] { display: none !important; }</style>
  </head>
  <body class="import-page">
    <div class="site">
      <header class="lang-bar">
        <select class="lang-select" id="lang-select" aria-label="Select language">
          <option value="en">EN</option>
          <option value="pt">PT</option>
          <option value="es">ES</option>
        </select>
      </header>

      <main class="import-main">
        <section class="import-card" aria-labelledby="handoff-title">
          <img class="import-logo" src="/Imagotype.png" alt="Gynus" />
          <p class="import-eyebrow" data-i18n="eyebrow">Group invite</p>
          <h1 class="import-title" id="handoff-title" data-i18n="title">Opening your invite…</h1>
          <p class="import-copy" data-i18n="intro">
            A Gynus group is waiting for you. Open the app to join.
          </p>

          <div class="import-status" id="status-row" aria-live="polite">
            <span class="import-spinner" id="spinner" aria-hidden="true"></span>
            <span id="status" data-i18n="opening">Trying to open the app…</span>
          </div>

          <a class="button button-primary import-open" href="#" id="open-app" data-i18n="open">
            Open Gynus
          </a>

          <p class="import-install" id="install-copy" data-i18n="install">
            If Gynus is not installed, we’ll take you to the right app store automatically.
          </p>

          <div class="store-buttons import-store-buttons" id="store-buttons">
            <a
              class="store-badge"
              href="https://apps.apple.com/app/id6764876378"
              aria-label="Download on the App Store"
            >
              <svg width="28" height="34" viewBox="0 0 24 24" fill="white" aria-hidden="true">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
              </svg>
              <span class="store-badge-text">
                <span class="store-badge-sub" data-i18n="appStoreSub">Download on the</span>
                <span class="store-badge-name">App Store</span>
              </span>
            </a>
            <a
              class="store-badge"
              href="https://play.google.com/store/apps/details?id=fit.gynus.app"
              aria-label="Get it on Google Play"
            >
              <svg width="28" height="34" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#00A0FF" d="M6.7 4.2A3.1 3.1 0 0 0 5 7v34a3.1 3.1 0 0 0 1.7 2.8L27.5 24 6.7 4.2z" />
                <path fill="#00C853" d="m27.5 24 7.2-6.9L10.8 3.5a3.2 3.2 0 0 0-4.1.7L27.5 24z" />
                <path fill="#FFEA00" d="m34.7 17.1-7.2 6.9 7.2 6.9 7.9-4.5c2.2-1.3 2.2-4.5 0-5.8l-7.9-3.5z" />
                <path fill="#FF3D00" d="M6.7 43.8a3.2 3.2 0 0 0 4.1.7l23.9-13.6-7.2-6.9L6.7 43.8z" />
              </svg>
              <span class="store-badge-text">
                <span class="store-badge-sub" data-i18n="playStoreSub">GET IT ON</span>
                <span class="store-badge-name">Google Play</span>
              </span>
            </a>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <nav class="footer-nav" aria-label="Footer">
          <a href="/" data-i18n="home">Home</a>
          <a href="/privacy.html" data-i18n="privacy">Privacy Policy</a>
          <a href="/terms.html" data-i18n="terms">Terms of Service</a>
        </nav>
      </footer>
    </div>

    <script>
      const translations = {
        en: {
          pageTitle: 'Open Gynus — Join your group',
          eyebrow: 'Group invite',
          title: 'Opening your invite…',
          intro: 'A Gynus group is waiting for you. Open the app to join.',
          opening: 'Trying to open the app…',
          desktop: 'Open this invite on your phone, or choose a store below.',
          open: 'Open Gynus',
          install: 'If Gynus is not installed, we’ll take you to the right app store automatically.',
          appStoreSub: 'Download on the',
          playStoreSub: 'GET IT ON',
          home: 'Home',
          privacy: 'Privacy Policy',
          terms: 'Terms of Service',
          notFoundTitle: 'Page not found',
          notFoundCopy: 'This page does not exist.',
        },
        pt: {
          pageTitle: 'Abrir Gynus — Entre no seu grupo',
          eyebrow: 'Convite de grupo',
          title: 'Abrindo seu convite…',
          intro: 'Um grupo do Gynus está esperando por você. Abra o app para entrar.',
          opening: 'Tentando abrir o app…',
          desktop: 'Abra este convite no celular ou escolha uma loja abaixo.',
          open: 'Abrir Gynus',
          install: 'Se o Gynus não estiver instalado, levaremos você automaticamente à loja certa.',
          appStoreSub: 'Baixar na',
          playStoreSub: 'DISPONÍVEL NO',
          home: 'Início',
          privacy: 'Política de Privacidade',
          terms: 'Termos de Serviço',
          notFoundTitle: 'Página não encontrada',
          notFoundCopy: 'Esta página não existe.',
        },
        es: {
          pageTitle: 'Abrir Gynus — Únete a tu grupo',
          eyebrow: 'Invitación al grupo',
          title: 'Abriendo tu invitación…',
          intro: 'Un grupo de Gynus te está esperando. Abre la app para unirte.',
          opening: 'Intentando abrir la app…',
          desktop: 'Abre esta invitación en tu móvil o elige una tienda abajo.',
          open: 'Abrir Gynus',
          install: 'Si Gynus no está instalado, te llevaremos automáticamente a la tienda correcta.',
          appStoreSub: 'Descargar en el',
          playStoreSub: 'DISPONIBLE EN',
          home: 'Inicio',
          privacy: 'Política de Privacidad',
          terms: 'Términos de Servicio',
          notFoundTitle: 'Página no encontrada',
          notFoundCopy: 'Esta página no existe.',
        },
      };

      function detectLanguage() {
        try {
          const saved = localStorage.getItem('lang');
          if (saved && translations[saved]) return saved;
        } catch (error) {}
        const browser = (navigator.language || '').toLowerCase();
        if (browser.startsWith('pt')) return 'pt';
        if (browser.startsWith('es')) return 'es';
        return 'en';
      }

      function setLanguage(language) {
        const copy = translations[language] || translations.en;
        document.documentElement.lang = language === 'pt' ? 'pt-BR' : language;
        document.title = copy.pageTitle;
        for (const node of document.querySelectorAll('[data-i18n]')) {
          const value = copy[node.dataset.i18n];
          if (value !== undefined) node.textContent = value;
        }
        document.getElementById('lang-select').value = language;
        try { localStorage.setItem('lang', language); } catch (error) {}
      }

      const path = window.location.pathname.replace(/\/+$/, '');
      const match = path.match(/^\/join-group\/([A-Za-z0-9]{10,32})$/);
      const language = detectLanguage();
      const appStoreUrl = 'https://apps.apple.com/app/id6764876378';
      const playStoreUrl = 'https://play.google.com/store/apps/details?id=fit.gynus.app';
      const userAgent = navigator.userAgent || '';
      const isIPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
      const isIOS = /iPhone|iPad|iPod/i.test(userAgent) || isIPadOS;
      const isAndroid = /Android/i.test(userAgent);
      let fallbackTimer = null;

      setLanguage(language);

      function cancelStoreFallback() {
        if (fallbackTimer !== null) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
      }

      function showNotFound(language) {
        const copy = translations[language] || translations.en;
        document.title = copy.notFoundTitle + ' — Gynus';
        document.querySelector('[data-i18n="eyebrow"]').textContent = 'Gynus';
        document.getElementById('handoff-title').textContent = copy.notFoundTitle;
        document.querySelector('[data-i18n="intro"]').textContent = copy.notFoundCopy;
        document.getElementById('status-row').hidden = true;
        document.getElementById('open-app').hidden = true;
        document.getElementById('install-copy').hidden = true;
        document.getElementById('store-buttons').hidden = true;
      }

      document.getElementById('lang-select').addEventListener('change', (event) => {
        const selectedLanguage = event.target.value;
        setLanguage(selectedLanguage);
        if (!match) {
          showNotFound(selectedLanguage);
        } else if (!isIOS && !isAndroid) {
          document.getElementById('status').textContent = translations[selectedLanguage].desktop;
        }
      });

      if (!match) {
        showNotFound(language);
      } else {
        const token = match[1];
        const schemeUrl = 'gynus://join-group/' + token;

        function openAppWithFallback() {
          cancelStoreFallback();
          if (isIOS || isAndroid) {
            const storeUrl = isIOS ? appStoreUrl : playStoreUrl;
            fallbackTimer = setTimeout(() => window.location.replace(storeUrl), 1200);
          }
          window.location.href = schemeUrl;
        }

        document.getElementById('open-app').href = schemeUrl;
        document.getElementById('open-app').addEventListener('click', (event) => {
          event.preventDefault();
          openAppWithFallback();
        });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') cancelStoreFallback();
        });
        window.addEventListener('pagehide', cancelStoreFallback);

        if (isIOS || isAndroid) {
          openAppWithFallback();
        } else {
          document.getElementById('spinner').hidden = true;
          document.getElementById('status').textContent = translations[language].desktop;
        }
      }
    </script>
  </body>
</html>
